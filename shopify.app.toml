# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7ef6c58d460efa4c0ba4aec0092b8166"
name = "image bulk uploader"
application_url = "https://image-bulk-uploader-shopify.onrender.com"
embedded = true

[webhooks]
api_version = "2026-10"

[events]
api_version = "unstable"

[[events.subscription]]
handle = "product-events"
topic = "Product"
actions = [ "create" ]
uri = "/api/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[auth]
redirect_urls = [
  "https://image-bulk-uploader-shopify.onrender.com/auth/callback",
  "https://image-bulk-uploader-shopify.onrender.com/auth/login"
]

[build]
automatically_update_urls_on_dev = true
